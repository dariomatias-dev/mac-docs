name: Bug report
description: Something in the site is broken (not a math/content error; use "Content error" for that).
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What's broken?
      description: A clear description of the bug.
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Page URL
      description: The exact page where this happens, if applicable.
      placeholder: https://mac-docs.vercel.app/docs/...
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: Chrome 129 on Windows 11 / Safari on iOS 18
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop images here if they help.
    validations:
      required: false
