name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Check content
        run: pnpm run content:check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup

      - name: Unit tests with coverage
        run: pnpm run test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup

      # Speeds up `next build` on repeat runs. Never affects correctness —
      # .next/cache is an accelerator, the .next output itself is always
      # produced fresh by this build.
      - name: Cache Next.js build cache
        uses: actions/cache@v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm run build

      - name: Check bundle size
        run: pnpm run check:bundle-size

      # include-hidden-files is required: upload-artifact excludes any path
      # under a dot-prefixed directory by default, and .next qualifies.
      # Without it this step silently uploads an empty artifact.
      - name: Upload build output
        uses: actions/upload-artifact@v7.0.1
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: End-to-end tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup

      - name: Download build output
        uses: actions/download-artifact@v8.0.1
        with:
          name: next-build
          path: .next

      # Caches the downloaded browser binaries by the pinned @playwright/test
      # version (captured in the lockfile hash). System dependencies still
      # install every run — apt packages aren't meaningfully cacheable here.
      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  vulnerabilities:
    name: Vulnerabilities (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup

      # A new high-severity advisory in an unrelated transitive dev
      # dependency (e.g. a commitlint or shadcn tool) must not block every
      # PR until someone happens to bump it. This job reports; it never
      # gates the pipeline.
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true

      # Same report-only rationale as the audit step above, scanning the
      # lockfile against the OSV database instead of the npm advisory feed
      # (different sources, some overlap, neither is a superset of the other).
      # Pinned by major version, like the CodeQL actions: Dependabot proposes
      # the tightened exact pin as releases land.
      - name: Scan the lockfile with osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
        continue-on-error: true

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lighthouse:
    name: Lighthouse (report only)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup

      - name: Download build output
        uses: actions/download-artifact@v8.0.1
        with:
          name: next-build
          path: .next

      # ubuntu-latest ships Google Chrome preinstalled; lighthouserc.json's
      # assertions are all "warn", so this reports scores without gating the
      # pipeline — see docs/en/performance.md for the plan to tighten that
      # once a couple of weeks of runs show the numbers are stable.
      - name: Run Lighthouse CI
        run: pnpm run lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        # Belt and suspenders on top of lighthouserc.json's all-"warn"
        # assertions: a flaky report upload or a slow server start shouldn't
        # fail a PR over a job whose whole point is not gating one.
        continue-on-error: true
